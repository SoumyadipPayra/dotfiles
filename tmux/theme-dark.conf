# Gruvbox-dark tmux status bar -- matches Terminal.app's "Mono Dark" profile
# and Neovim's gruvbox (hard contrast) colorscheme.
set -g status-style "bg=#16181a,fg=#ebdbb2"
set -g status-left "#[fg=#16181a,bg=#fe8019,bold] #S #[fg=#fe8019,bg=#16181a]"
set -g status-right "#[fg=#928374]%H:%M #[fg=#ebdbb2,bg=#928374] %d-%b-%y "
setw -g window-status-current-format "#[fg=#16181a,bg=#b8bb26,bold] #I:#W #[fg=#b8bb26,bg=#16181a]"
setw -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=#fe8019"
set -g pane-border-style "fg=#928374"
set -g message-style "bg=#fe8019,fg=#16181a"
