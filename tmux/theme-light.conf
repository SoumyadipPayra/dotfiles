# Bold-accent light tmux status bar -- matches Terminal.app's "Mono Light"
# profile (cool neutral gray, not a cream/Gruvbox-light background).
set -g status-style "bg=#f4f4f5,fg=#24272b"
set -g status-left "#[fg=#f4f4f5,bg=#d65d0e,bold] #S #[fg=#d65d0e,bg=#f4f4f5]"
set -g status-right "#[fg=#6b7280]%H:%M #[fg=#f4f4f5,bg=#6b7280] %d-%b-%y "
setw -g window-status-current-format "#[fg=#f4f4f5,bg=#116329,bold] #I:#W #[fg=#116329,bg=#f4f4f5]"
setw -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=#d65d0e"
set -g pane-border-style "fg=#6b7280"
set -g message-style "bg=#d65d0e,fg=#f4f4f5"
