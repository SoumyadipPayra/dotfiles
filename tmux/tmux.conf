# ============================================================================
# General
# ============================================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # truecolor passthrough
set -sg escape-time 10                            # fast Esc, but not 0 (some apps miss 0)
set -g history-limit 50000
set -g base-index 1                               # windows start at 1, easier to reach
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on                            # lets Neovim know when a pane loses focus
set -g mouse on                                   # click to select pane/window, drag to resize

# ============================================================================
# Prefix: Ctrl-a (screen-style; easier reach than the default Ctrl-b)
# ============================================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ============================================================================
# Splits / windows (keep the current pane's working directory)
# ============================================================================
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane <-> pane navigation is handled by vim-tmux-navigator below: Ctrl-h/j/k/l
# moves seamlessly between tmux panes AND Neovim splits, matching the same
# keys already bound for window navigation inside this Neovim config.

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================================
# Copy mode: vi keys, yank straight to the macOS clipboard
# ============================================================================
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ============================================================================
# Status bar (colors come from theme-dark.conf / theme-light.conf below;
# the `theme` shell function live-switches which one is active)
# ============================================================================
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 60

# ============================================================================
# Plugins (managed by TPM -- https://github.com/tmux-plugins/tpm)
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # persist sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save/restore, no manual step
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# ============================================================================
# Active theme -- defaults to dark; `theme light|dark|toggle` (see
# zsh/nvim-dotfiles.zsh) live-reloads whichever of these matches
# ============================================================================
source-file -q ~/dotfiles/tmux/theme-dark.conf

# keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
